<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>STC AI Avatar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    /* =========================================
       9:16 PORTRAIT FRAME
       ========================================= */

    .avatar-frame {

      position: relative;

      width: min(90vw, 450px);

      aspect-ratio: 9 / 16;

      background-color: #4f008c;

      background-image: url("stcimages.jpg");

      background-repeat: no-repeat;

      background-position: top 18px left 18px;

      background-size: 90px auto;

      border-radius: 28px;

      overflow: hidden;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.30);
    }


    /* =========================================
       ANAM CROPPED PLAYER
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      overflow: hidden;

      border-radius: 28px;
    }


    .anam-crop iframe {

      position: absolute;

      width: 177.78%;

      height: 100%;

      left: 50%;

      top: 0;

      transform: translateX(-50%);

      border: 0;

      margin: 0;

      padding: 0;

      display: block;

      background: #4f008c;
    }


    /* =========================================
       LOGO BACKGROUND LAYER
       ========================================= */

    .logo-layer {

      position: absolute;

      top: 18px;

      left: 18px;

      width: 90px;

      height: 45px;

      background-image: url("stcimages.jpg");

      background-repeat: no-repeat;

      background-position: center;

      background-size: contain;

      z-index: 10;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <div class="avatar-frame">


    <!-- STC LOGO -->

    <div class="logo-layer"></div>


    <!-- ANAM AI AVATAR -->

    <div class="anam-crop">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        allow="microphone; autoplay"
        allowfullscreen>
      </iframe>

    </div>


  </div>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI Portrait Avatar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* =====================================
       PORTRAIT FRAME — 9:16
       ===================================== */

    .anam-portrait {
      position: relative;

      width: min(90vw, 450px);
      aspect-ratio: 9 / 16;

      background: #4f008c;

      overflow: hidden;

      border: none;
    }

    /* =====================================
       ENLARGED ANAM CONTENT
       ===================================== */

    .anam-iframe-wrapper {
      position: absolute;

      width: 120%;
      height: 120%;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      overflow: hidden;
    }

    .anam-iframe-wrapper iframe {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #4f008c;
    }
  </style>
</head>

<body>

  <div class="anam-portrait">

    <div class="anam-iframe-wrapper">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        allow="microphone; autoplay"
        allowfullscreen>
      </iframe>

    </div>

  </div>

</body>
</html>

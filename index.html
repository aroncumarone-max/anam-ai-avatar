<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Anam AI Portrait</title>

  <style>
    /* =========================================
       GLOBAL
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }


    /* =========================================
       MAIN BACKGROUND
       ========================================= */

    .page-background {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background-color: #4f008c;

      background-image: url("stcimages.jpg");
      background-repeat: no-repeat;
      background-position: 25px 25px;
      background-size: 100px auto;

      z-index: 0;

      pointer-events: none;
    }


    /* =========================================
       PAGE / CENTERING
       ========================================= */

    .page {
      position: relative;

      z-index: 1;

      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =========================================
       PORTRAIT CONTAINER
       
       ALWAYS 9:16
       ========================================= */

    .portrait-container {

      position: relative;

      /*
        Width is limited by BOTH:
        - screen width
        - screen height

        This guarantees 9:16 always fits.
      */

      width: min(
        90vw,
        calc(100dvh * 9 / 16)
      );

      aspect-ratio: 9 / 16;

      max-height: 94dvh;

      background: #4f008c;

      overflow: hidden;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.30);
    }


    /* =========================================
       ANAM CROP AREA
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;
    }


    /* =========================================
       ANAM IFRAME
       
       Original Anam iframe:
       720 x 480 = 3:2

       Enlarged to fill portrait window.
       ========================================= */

    .anam-crop iframe {

      position: absolute;

      top: 0;
      left: 50%;

      width: 177.78%;
      height: 100%;

      transform: translateX(-50%);

      border: 0;

      margin: 0;
      padding: 0;

      display: block;

      background: #4f008c;
    }


    /* =========================================
       FULL SCREEN BUTTON
       ========================================= */

    .fullscreen-button {

      position: absolute;

      right: 14px;
      bottom: 14px;

      z-index: 20;

      width: 44px;
      height: 44px;

      padding: 0;

      border: 0;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.65);

      color: #ffffff;

      font-size: 22px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      -webkit-tap-highlight-color: transparent;
    }

    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.85);
    }


    /* =========================================
       FULL SCREEN MODE
       ========================================= */

    .portrait-container:fullscreen {

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: auto;

      max-height: 100dvh;

      aspect-ratio: 9 / 16;

      margin: 0;

      border-radius: 0;

      box-shadow: none;

      background: #4f008c;
    }

    .portrait-container:fullscreen
    .anam-crop {

      border-radius: 0;
    }


    /* =========================================
       SMALL MOBILE DEVICES
       ========================================= */

    @media (max-width: 600px) {

      .portrait-container {

        width: min(
          94vw,
          calc(100dvh * 9 / 16)
        );

        max-height: 96dvh;

        border-radius: 16px;
      }

      .fullscreen-button {

        width: 42px;
        height: 42px;

        right: 10px;
        bottom: 10px;

        font-size: 20px;
      }
    }


    /* =========================================
       VERY SHORT SCREENS
       ========================================= */

    @media (max-height: 600px) {

      .portrait-container {

        height: 94dvh;

        width: calc(94dvh * 9 / 16);

        max-width: 94vw;
      }
    }

  </style>
</head>


<body>

  <!-- =========================================
       STC MAIN BACKGROUND
       ========================================= -->

  <div class="page-background"></div>


  <!-- =========================================
       PAGE
       ========================================= -->

  <main class="page">

    <!-- =======================================
         ANAM PORTRAIT
         ======================================= -->

    <section
      id="anamPortrait"
      class="portrait-container"
    >

      <div class="anam-crop">

        <iframe
          src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
          allow="microphone; fullscreen"
          allowfullscreen>
        </iframe>

      </div>


      <!-- FULL SCREEN -->

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        type="button"
        aria-label="Full Screen"
        title="Full Screen"
      >
        ⛶
      </button>

    </section>

  </main>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const portrait =
      document.getElementById("anamPortrait");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    /* -----------------------------------------
       FULL SCREEN
       ----------------------------------------- */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Full screen error:",
            error
          );

        }

      }
    );


    /* -----------------------------------------
       CHANGE BUTTON ICON
       ----------------------------------------- */

    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Exit Full Screen"
          );

        } else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Full Screen"
          );

        }

      }
    );

  </script>

</body>
</html>

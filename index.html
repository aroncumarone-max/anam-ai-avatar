<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anam AI Portrait Avatar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    /* ==========================================
       PORTRAIT VIEWPORT
       EXACT 9:16
       ========================================== */

    .portrait-frame {

      position: relative;

      width: min(90vw, 450px);

      aspect-ratio: 9 / 16;

      background: #4f008c;

      overflow: hidden;
    }


    /* ==========================================
       ANAM PLAYER
       LANDSCAPE SOURCE
       ========================================== */

    .anam-crop {

      position: absolute;

      width: 177.78%;
      height: 100%;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      overflow: hidden;
    }


    /* ==========================================
       IFRAME
       ========================================== */

    .anam-crop iframe {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #4f008c;
    }

  </style>

</head>


<body>


  <div class="portrait-frame">

    <div class="anam-crop">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        allow="microphone; autoplay"
        allowfullscreen>
      </iframe>

    </div>

  </div>


</body>

</html>

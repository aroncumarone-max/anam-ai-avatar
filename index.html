<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI Portrait Widget</title>

  <style>

    /* =====================================
       GLOBAL
       ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =====================================
       BACKGROUND LOGO
       TOP LEFT
       ===================================== */

    .background-logo {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 99999;

      width: 120px;
      height: auto;

      max-height: 60px;

      object-fit: contain;

      /*
       * Convert JPG logo to white
       */
      filter:
        brightness(0)
        invert(1)
        drop-shadow(
          0 2px 5px rgba(0, 0, 0, 0.30)
        );

      pointer-events: none;
    }


    /* =====================================
       MODERN FULLSCREEN BUTTON
       ===================================== */

    .fullscreen-btn {
      position: fixed;

      top: 20px;
      right: 20px;

      z-index: 99999;

      width: 44px;
      height: 44px;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.22);

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.10);

      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.18);

      transform: translateY(-1px);

      box-shadow:
        0 7px 22px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }


    .fullscreen-btn:active {
      transform: scale(0.94);
    }


    .fullscreen-btn svg {
      width: 20px;
      height: 20px;

      fill: none;

      stroke: #ffffff;

      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =====================================
       9:16 PORTRAIT ANAM CONTAINER
       ===================================== */

    .anam-container {
      position: relative;

      width: min(450px, 90vw);

      height: min(800px, 90vh);

      aspect-ratio: 9 / 16;

      background: #4f008c;

      overflow: hidden;

      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }


    /* =====================================
       ANAM WIDGET
       ===================================== */

    .anam-widget {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }


    .anam-widget anam-agent {
      display: block;

      width: 100%;
      height: 100%;
    }


    /* =====================================
       FULLSCREEN MODE
       ===================================== */

    .anam-container:fullscreen {

      width: 100vw;
      height: 100vh;

      max-width: none;
      max-height: none;

      aspect-ratio: auto;

      border-radius: 0;

      box-shadow: none;

      background: #4f008c;
    }


    .anam-container:fullscreen .anam-widget {

      width: 100vw;
      height: 100vh;
    }


    .anam-container:fullscreen anam-agent {

      width: 100vw !important;
      height: 100vh !important;
    }


    /* =====================================
       STRETCH ANAM VIDEO IN FULLSCREEN
       ===================================== */

    .anam-container:fullscreen video {

      width: 100% !important;
      height: 100% !important;

      max-width: none !important;
      max-height: none !important;

      object-fit: fill !important;
    }


    /* =====================================
       MOBILE
       ===================================== */

    @media (max-width: 600px) {

      .background-logo {

        top: 14px;
        left: 14px;

        width: 90px;
      }


      .fullscreen-btn {

        top: 14px;
        right: 14px;

        width: 42px;
        height: 42px;

        border-radius: 11px;
      }


      .fullscreen-btn svg {

        width: 19px;
        height: 19px;
      }


      .anam-container {

        width: 100vw;
        height: 100vh;

        border-radius: 0;

        box-shadow: none;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       WHITE STC LOGO
       BACKGROUND ONLY
       ===================================== -->

  <img
    src="stcimages.jpg"
    class="background-logo"
    alt="STC"
  >


  <!-- =====================================
       MODERN FULLSCREEN BUTTON
       ===================================== -->

  <button
    id="fullscreenBtn"
    class="fullscreen-btn"
    type="button"
    aria-label="Enter fullscreen"
    title="Fullscreen"
  >

    <!-- ================================
         EXPAND ICON
         ================================ -->

    <svg
      id="expandIcon"
      viewBox="0 0 24 24"
    >

      <path d="M8 3H3v5"></path>
      <path d="M3 3l5 5"></path>

      <path d="M16 3h5v5"></path>
      <path d="M21 3l-5 5"></path>

      <path d="M8 21H3v-5"></path>
      <path d="M3 21l5-5"></path>

      <path d="M16 21h5v-5"></path>
      <path d="M21 21l-5-5"></path>

    </svg>


    <!-- ================================
         COMPRESS / EXIT ICON
         ================================ -->

    <svg
      id="compressIcon"
      viewBox="0 0 24 24"
      style="display:none;"
    >

      <path d="M9 3v6H3"></path>
      <path d="M3 9l6-6"></path>

      <path d="M15 3v6h6"></path>
      <path d="M21 9l-6-6"></path>

      <path d="M9 21v-6H3"></path>
      <path d="M3 15l6 6"></path>

      <path d="M15 21v-6h6"></path>
      <path d="M21 15l-6 6"></path>

    </svg>

  </button>


  <!-- =====================================
       9:16 ANAM PORTRAIT WIDGET
       ===================================== -->

  <div
    id="anamContainer"
    class="anam-container"
  >

    <div class="anam-widget">

      <anam-agent
        agent-id="3d31783d-0b54-490c-971b-654cdc4a4dc5"
        api-base-url="https://lab.anam.ai">
      </anam-agent>

    </div>

  </div>


  <!-- =====================================
       ANAM AGENT SCRIPT
       ===================================== -->

  <script
    src="https://unpkg.com/@anam-ai/agent-widget"
    async>
  </script>


  <!-- =====================================
       FULLSCREEN JAVASCRIPT
       ===================================== -->

  <script>

    const container =
      document.getElementById("anamContainer");

    const button =
      document.getElementById("fullscreenBtn");

    const expandIcon =
      document.getElementById("expandIcon");

    const compressIcon =
      document.getElementById("compressIcon");


    /* =====================================
       FULLSCREEN BUTTON CLICK
       ===================================== */

    button.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await container.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


    /* =====================================
       FULLSCREEN STATE CHANGE
       ===================================== */

    document.addEventListener(
      "fullscreenchange",
      () => {

        const isFullscreen =
          document.fullscreenElement === container;


        if (isFullscreen) {

          expandIcon.style.display = "none";

          compressIcon.style.display = "block";

          button.setAttribute(
            "aria-label",
            "Exit fullscreen"
          );

          button.setAttribute(
            "title",
            "Exit fullscreen"
          );

        } else {

          expandIcon.style.display = "block";

          compressIcon.style.display = "none";

          button.setAttribute(
            "aria-label",
            "Enter fullscreen"
          );

          button.setAttribute(
            "title",
            "Fullscreen"
          );

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anam AI 9:16 Portrait</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    /* =========================================
       9:16 PORTRAIT WINDOW
       ========================================= */

    .portrait {

      position: relative;

      width: min(90vw, 450px);

      aspect-ratio: 9 / 16;

      background: #4f008c;

      overflow: hidden;

      margin: auto;
    }


    /* =========================================
       CROP AREA
       ========================================= */

    .crop {

      position: absolute;

      inset: 0;

      overflow: hidden;
    }


    /* =========================================
       ANAM IFRAME
       ========================================= */

    .crop iframe {

      position: absolute;

      width: 177.78%;

      height: 100%;

      left: 50%;

      top: 0;

      transform: translateX(-50%);

      border: 0;

      margin: 0;

      padding: 0;

      display: block;

      background: #4f008c;
    }

  </style>

</head>


<body>


  <div class="portrait">

    <div class="crop">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        allow="microphone; autoplay"
        allowfullscreen>
      </iframe>

    </div>

  </div>


</body>

</html>

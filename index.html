<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Anam AI Portrait 9:16</title>


  <style>

    /* =========================================
       GLOBAL
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }


    /* =========================================
       MAIN PAGE
       ========================================= */

    .page {

      position: relative;

      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #4f008c;
    }


    /* =========================================
       PORTRAIT WRAPPER
       
       Keeps the mobile controls aligned
       with the portrait container.
       ========================================= */

    .portrait-wrapper {

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;
    }


    /* =========================================
       MOBILE TOP CONTROLS
       
       Hidden by default.
       Desktop uses fixed controls.
       ========================================= */

    .mobile-controls {

      display: none;
    }


    /* =========================================
       STC LOGO
       DESKTOP
       ========================================= */

    .stc-logo {

      position: fixed;

      top: 22px;
      left: 28px;

      width: 100px;
      height: auto;

      z-index: 1000;

      filter: brightness(0) invert(1);

      pointer-events: none;

      user-select: none;
    }


    /* =========================================
       FULLSCREEN BUTTON
       DESKTOP
       ========================================= */

    .fullscreen-button {

      position: fixed;

      top: 18px;
      right: 25px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.35);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.35);

      color: #ffffff;

      font-size: 23px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }


    .fullscreen-button:hover {

      background: rgba(0, 0, 0, 0.60);

      transform: scale(1.08);
    }


    .fullscreen-button:active {

      transform: scale(0.95);
    }


    /* =========================================
       9:16 PORTRAIT CONTAINER
       ========================================= */

    .portrait-container {

      position: relative;

      width: min(
        90vw,
        calc(92dvh * 9 / 16)
      );

      aspect-ratio: 9 / 16;

      max-height: 92dvh;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.30);

      transition:
        width 0.45s ease,
        height 0.45s ease,
        border-radius 0.45s ease,
        box-shadow 0.45s ease,
        transform 0.45s ease;
    }


    /* =========================================
       ANAM CROPPING WINDOW
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;
    }


    /* =========================================
       ANAM IFRAME
       
       CURRENT SETTING RETAINED:
       190% WIDTH
       
       This keeps the avatar visually smaller
       inside the 9:16 portrait window.
       ========================================= */

    .anam-crop iframe {

      position: absolute;

      width: 190%;

      height: 100%;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      margin: 0;
      padding: 0;

      border: 0;

      display: block;

      background: #4f008c;
    }


    /* =========================================
       FULLSCREEN PORTRAIT
       ========================================= */

    .portrait-container:fullscreen {

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: 100dvh;

      max-height: 100dvh;

      aspect-ratio: 9 / 16;

      margin: 0;

      border-radius: 0;

      box-shadow: none;

      background: #4f008c;

      animation: fullscreenIn 0.45s ease;
    }


    .portrait-container:fullscreen .anam-crop {

      border-radius: 0;
    }


    /* =========================================
       FULLSCREEN ANIMATION
       ========================================= */

    @keyframes fullscreenIn {

      0% {

        opacity: 0.85;

        transform: scale(0.96);
      }

      100% {

        opacity: 1;

        transform: scale(1);
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      /*
         Main page becomes a vertical layout.
      */

      .page {

        align-items: center;

        justify-content: center;

        padding: 0;

      }


      /*
         Wrapper follows the portrait width.
      */

      .portrait-wrapper {

        width: min(
          94vw,
          calc(94dvh * 9 / 16)
        );

        height: auto;

        display: flex;

        flex-direction: column;

        align-items: stretch;

        justify-content: center;
      }


      /* -----------------------------------------
         MOBILE CONTROLS
         ----------------------------------------- */

      .mobile-controls {

        display: flex;

        width: 100%;

        height: 52px;

        align-items: center;

        justify-content: space-between;

        padding: 0 0 8px 0;
      }


      /* -----------------------------------------
         MOBILE STC LOGO
         LEFT ABOVE PORTRAIT
         ----------------------------------------- */

      .mobile-controls .stc-logo-mobile {

        display: block;

        width: 78px;

        height: auto;

        filter: brightness(0) invert(1);

        pointer-events: none;

        user-select: none;
      }


      /* -----------------------------------------
         MOBILE FULLSCREEN BUTTON
         RIGHT ABOVE PORTRAIT
         ----------------------------------------- */

      .mobile-controls .fullscreen-button-mobile {

        width: 42px;

        height: 42px;

        padding: 0;

        border: 1px solid rgba(
          255,
          255,
          255,
          0.35
        );

        border-radius: 50%;

        background: rgba(
          0,
          0,
          0,
          0.35
        );

        color: #ffffff;

        font-size: 20px;

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        backdrop-filter: blur(8px);

        -webkit-backdrop-filter: blur(8px);

        transition:
          background 0.25s ease,
          transform 0.25s ease;
      }


      .mobile-controls
      .fullscreen-button-mobile:hover {

        background: rgba(
          0,
          0,
          0,
          0.60
        );

        transform: scale(1.08);
      }


      .mobile-controls
      .fullscreen-button-mobile:active {

        transform: scale(0.95);
      }


      /* -----------------------------------------
         HIDE DESKTOP CONTROLS
         ----------------------------------------- */

      .page > .stc-logo {

        display: none;
      }


      .page > .fullscreen-button {

        display: none;
      }


      /* -----------------------------------------
         PORTRAIT CONTAINER
         ----------------------------------------- */

      .portrait-container {

        width: 100%;

        max-height: none;

        aspect-ratio: 9 / 16;

        margin: 0;

        border-radius: 16px;
      }


      /* -----------------------------------------
         ANAM CROP
         ----------------------------------------- */

      .anam-crop {

        border-radius: 16px;
      }

    }


    /* =========================================
       LANDSCAPE / SHORT SCREEN
       ========================================= */

    @media (max-height: 600px) {

      .portrait-container {

        height: 92dvh;

        width: calc(
          92dvh * 9 / 16
        );

        max-width: 90vw;
      }

    }


    /* =========================================
       MOBILE + SHORT SCREEN
       ========================================= */

    @media (
      max-width: 600px
    ) and (
      max-height: 600px
    ) {

      .portrait-wrapper {

        width: min(
          94vw,
          calc(86dvh * 9 / 16)
        );
      }


      .portrait-container {

        width: 100%;

        height: auto;

        aspect-ratio: 9 / 16;

        max-width: 100%;

        max-height: none;
      }


      .mobile-controls {

        height: 48px;

        padding-bottom: 6px;
      }


      .mobile-controls
      .stc-logo-mobile {

        width: 70px;
      }


      .mobile-controls
      .fullscreen-button-mobile {

        width: 38px;

        height: 38px;

        font-size: 18px;
      }

    }


    /* =========================================
       FULLSCREEN - HIDE MOBILE CONTROLS
       ========================================= */

    .portrait-container:fullscreen
    ~ * {

      display: none;
    }


  </style>

</head>


<body>


  <!-- =======================================
       MAIN PAGE
       ======================================= -->

  <main class="page">


    <!-- =====================================
         DESKTOP STC LOGO
         ===================================== -->

    <img
      class="stc-logo"
      src="stcimages.jpg"
      alt="stc"
    >


    <!-- =====================================
         DESKTOP FULLSCREEN BUTTON
         ===================================== -->

    <button
      id="fullscreenButton"
      class="fullscreen-button"
      type="button"
      aria-label="Full Screen"
      title="Full Screen"
    >
      ⛶
    </button>


    <!-- =====================================
         PORTRAIT WRAPPER
         ===================================== -->

    <div class="portrait-wrapper">


      <!-- ===================================
           MOBILE TOP CONTROLS
           
           Logo = LEFT
           Fullscreen = RIGHT
           =================================== -->

      <div class="mobile-controls">


        <img
          class="stc-logo-mobile"
          src="stcimages.jpg"
          alt="stc"
        >


        <button
          id="fullscreenButtonMobile"
          class="fullscreen-button-mobile"
          type="button"
          aria-label="Full Screen"
          title="Full Screen"
        >
          ⛶
        </button>


      </div>


      <!-- ===================================
           9:16 PORTRAIT CONTAINER
           =================================== -->

      <section
        id="anamPortrait"
        class="portrait-container"
      >


        <!-- ================================
             ANAM CROPPING WINDOW
             ================================ -->

        <div class="anam-crop">


          <!-- ==============================
               ANAM AI AVATAR
               ============================== -->

          <iframe
            src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
            allow="microphone; fullscreen"
            allowfullscreen>
          </iframe>


        </div>


      </section>


    </div>


  </main>


  <!-- =======================================
       FULLSCREEN JAVASCRIPT
       ======================================= -->

  <script>

    const portrait =
      document.getElementById(
        "anamPortrait"
      );


    const fullscreenButton =
      document.getElementById(
        "fullscreenButton"
      );


    const fullscreenButtonMobile =
      document.getElementById(
        "fullscreenButtonMobile"
      );


    /* =====================================
       UPDATE BUTTON STATE
       ===================================== */

    function updateFullscreenButtons() {

      if (document.fullscreenElement) {

        fullscreenButton.textContent = "✕";

        fullscreenButton.title =
          "Exit Full Screen";

        fullscreenButton.setAttribute(
          "aria-label",
          "Exit Full Screen"
        );


        fullscreenButtonMobile.textContent =
          "✕";

        fullscreenButtonMobile.title =
          "Exit Full Screen";

        fullscreenButtonMobile.setAttribute(
          "aria-label",
          "Exit Full Screen"
        );

      }

      else {

        fullscreenButton.textContent = "⛶";

        fullscreenButton.title =
          "Full Screen";

        fullscreenButton.setAttribute(
          "aria-label",
          "Full Screen"
        );


        fullscreenButtonMobile.textContent =
          "⛶";

        fullscreenButtonMobile.title =
          "Full Screen";

        fullscreenButtonMobile.setAttribute(
          "aria-label",
          "Full Screen"
        );

      }

    }


    /* =====================================
       ENTER / EXIT FULLSCREEN
       ===================================== */

    async function toggleFullscreen() {

      try {

        if (!document.fullscreenElement) {

          await portrait.requestFullscreen();

        }

        else {

          await document.exitFullscreen();

        }

      }

      catch (error) {

        console.error(
          "Fullscreen error:",
          error
        );

      }

    }


    /* =====================================
       DESKTOP BUTTON
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      toggleFullscreen
    );


    /* =====================================
       MOBILE BUTTON
       ===================================== */

    fullscreenButtonMobile.addEventListener(
      "click",
      toggleFullscreen
    );


    /* =====================================
       FULLSCREEN STATE
       ===================================== */

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenButtons
    );


    /* =====================================
       INITIAL STATE
       ===================================== */

    updateFullscreenButtons();

  </script>


</body>

</html>

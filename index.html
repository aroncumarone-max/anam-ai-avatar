<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anam AI Portrait</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }

    /* =====================================
       MAIN PAGE BACKGROUND
       ===================================== */

    .page-background {
      position: fixed;

      inset: 0;

      background-color: #4f008c;

      background-image: url("stcimages.jpg");
      background-repeat: no-repeat;
      background-position: 25px 25px;
      background-size: 100px auto;

      z-index: 0;
    }


    /* =====================================
       PORTRAIT CONTAINER
       ===================================== */

    .portrait-container {
      position: relative;

      z-index: 1;

      width: min(90vw, 450px);

      aspect-ratio: 9 / 16;

      margin: 30px auto;

      /*
        IMPORTANT:
        Solid background hides the page logo
        from appearing inside the iframe.
      */
      background: #4f008c;

      overflow: hidden;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.30);
    }


    /* =====================================
       ANAM CROP
       ===================================== */

    .anam-crop {
      position: absolute;

      inset: 0;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;
    }


    /* =====================================
       ANAM IFRAME
       ===================================== */

    .anam-crop iframe {
      position: absolute;

      top: 0;
      left: 50%;

      width: 177.78%;
      height: 100%;

      transform: translateX(-50%);

      border: 0;

      display: block;

      background: #4f008c;
    }


    /* =====================================
       FULL SCREEN BUTTON
       ===================================== */

    .fullscreen-button {
      position: absolute;

      right: 15px;
      bottom: 15px;

      z-index: 20;

      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 22px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.85);
    }


    /* =====================================
       FULL SCREEN
       ===================================== */

    .portrait-container:fullscreen {

      width: 100vw;
      height: 100vh;

      max-width: none;

      aspect-ratio: auto;

      margin: 0;

      border-radius: 0;

      background: #4f008c;
    }

    .portrait-container:fullscreen
    .anam-crop {

      width: min(100vw, 56.25vh);
      height: 100vh;

      left: 50%;
      right: auto;

      inset-block-start: 0;

      transform: translateX(-50%);

      border-radius: 0;

      background: #4f008c;
    }


    /* =====================================
       MOBILE
       ===================================== */

    @media (max-width: 600px) {

      .portrait-container {

        width: 94vw;

        margin: 20px auto;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================
       MAIN BACKGROUND
       ===================================== -->

  <div class="page-background"></div>


  <!-- =====================================
       ANAM PORTRAIT
       ===================================== -->

  <div
    id="anamPortrait"
    class="portrait-container"
  >

    <div class="anam-crop">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        width="720"
        height="480"
        allow="microphone; fullscreen"
        allowfullscreen>
      </iframe>

    </div>


    <!-- FULL SCREEN BUTTON -->

    <button
      id="fullscreenButton"
      class="fullscreen-button"
      type="button"
      title="Full Screen"
      aria-label="Full Screen"
    >
      ⛶
    </button>

  </div>


  <script>

    const portrait =
      document.getElementById("anamPortrait");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Full screen error:",
            error
          );

        }

      }
    );


    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

        } else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

        }

      }
    );

  </script>

</body>
</html>

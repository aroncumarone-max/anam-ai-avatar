<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

  <title>Anam AI Portrait 9:16</title>

  <style>

    /* =========================================
       GLOBAL
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }


    /* =========================================
       MAIN PAGE
       ========================================= */

    .page {
      position: relative;

      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #4f008c;
    }


    /* =========================================
       STC LOGO
       ========================================= */

    .stc-logo {
      position: fixed;

      top: 22px;
      left: 28px;

      width: 100px;
      height: auto;

      z-index: 1000;

      filter: brightness(0) invert(1);

      pointer-events: none;

      user-select: none;
    }


    /* =========================================
       FULLSCREEN BUTTON
       ========================================= */

    .fullscreen-button {
      position: fixed;

      top: 18px;
      right: 25px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.35);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.35);

      color: #ffffff;

      font-size: 23px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }


    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.60);

      transform: scale(1.08);
    }


    .fullscreen-button:active {
      transform: scale(0.95);
    }


    /* =========================================
       9:16 PORTRAIT CONTAINER
       ========================================= */

    .portrait-container {

      position: relative;

      width: min(
        90vw,
        calc(92dvh * 9 / 16)
      );

      aspect-ratio: 9 / 16;

      max-height: 92dvh;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.30);

      isolation: isolate;

      transition:
        width 0.45s ease,
        height 0.45s ease,
        border-radius 0.45s ease,
        box-shadow 0.45s ease,
        transform 0.45s ease;
    }


    /* =========================================
       ANAM VIEWPORT
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* =========================================
       ANAM IFRAME
       
       IMPORTANT:
       Instead of making the iframe 190% wide,
       use a larger virtual viewport and scale
       it down.

       This makes the avatar appear smaller
       while keeping the 9:16 outer frame.
       ========================================= */

    .anam-crop iframe {

      position: absolute;

      width: 125%;
      height: 100%;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(0.80);

      transform-origin: center center;

      margin: 0;
      padding: 0;

      border: 0;

      display: block;

      background: #4f008c;

      max-width: none;
      max-height: none;
    }


    /* =========================================
       FULLSCREEN PORTRAIT
       ========================================= */

    .portrait-container:fullscreen {

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: 100dvh;

      max-height: 100dvh;

      aspect-ratio: 9 / 16;

      margin: 0;

      border-radius: 0;

      box-shadow: none;

      background: #4f008c;

      animation: fullscreenIn 0.45s ease;
    }


    .portrait-container:fullscreen .anam-crop {
      border-radius: 0;
    }


    /* =========================================
       FULLSCREEN IFRAME
       ========================================= */

    .portrait-container:fullscreen
    .anam-crop iframe {

      width: 125%;
      height: 100%;

      transform:
        translate(-50%, -50%)
        scale(0.80);
    }


    /* =========================================
       FULLSCREEN ANIMATION
       ========================================= */

    @keyframes fullscreenIn {

      0% {
        opacity: 0.85;
        transform: scale(0.96);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .stc-logo {

        top: 14px;
        left: 16px;

        width: 78px;
      }


      .fullscreen-button {

        top: 12px;
        right: 15px;

        width: 42px;
        height: 42px;

        font-size: 20px;
      }


      .portrait-container {

        width: min(
          94vw,
          calc(94dvh * 9 / 16)
        );

        max-height: 94dvh;

        border-radius: 16px;
      }


      .anam-crop {

        border-radius: 16px;
      }


      .anam-crop iframe {

        width: 125%;
        height: 100%;

        transform:
          translate(-50%, -50%)
          scale(0.80);
      }

    }


    /* =========================================
       SHORT / LANDSCAPE SCREEN
       ========================================= */

    @media (max-height: 600px) {

      .portrait-container {

        height: 92dvh;

        width: calc(
          92dvh * 9 / 16
        );

        max-width: 90vw;
      }

    }


    /* =========================================
       VERY SMALL MOBILE
       ========================================= */

    @media (max-width: 380px) {

      .portrait-container {

        width: 92vw;

        max-height: 94dvh;
      }


      .anam-crop iframe {

        width: 125%;
        height: 100%;

        transform:
          translate(-50%, -50%)
          scale(0.76);
      }

    }

  </style>

</head>

<body>

  <!-- =======================================
       MAIN PAGE
       ======================================= -->

  <main class="page">

```
<!-- =====================================
     STC LOGO
     ===================================== -->

<img
  class="stc-logo"
  src="stcimages.jpg"
  alt="stc"
>


<!-- =====================================
     FULLSCREEN BUTTON
     ===================================== -->

<button
  id="fullscreenButton"
  class="fullscreen-button"
  type="button"
  aria-label="Full Screen"
  title="Full Screen"
>
  ⛶
</button>


<!-- =====================================
     9:16 PORTRAIT CONTAINER
     ===================================== -->

<section
  id="anamPortrait"
  class="portrait-container"
>

  <!-- ===================================
       ANAM VIEWPORT
       =================================== -->

  <div class="anam-crop">


    <!-- ================================
         ANAM AI AVATAR
         ================================ -->

    <iframe
      src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
      allow="microphone; fullscreen"
      allowfullscreen>
    </iframe>


  </div>

</section>
```

  </main>

  <!-- =======================================
       FULLSCREEN JAVASCRIPT
       ======================================= -->

  <script>

    const portrait =
      document.getElementById("anamPortrait");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    /* =====================================
       FULLSCREEN BUTTON
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          }

          else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


    /* =====================================
       FULLSCREEN STATE
       ===================================== */

    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Exit Full Screen"
          );

        }

        else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Full Screen"
          );

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

  <title>Anam AI Portrait 9:16</title>

  <style>

    /* =========================================
       GLOBAL
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }


    /* =========================================
       MAIN PAGE
       ========================================= */

    .page {
      position: relative;

      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #4f008c;
    }


    /* =========================================
       STC LOGO
       ========================================= */

    .stc-logo {
      position: fixed;

      top: 22px;
      left: 28px;

      width: 100px;
      height: auto;

      z-index: 1000;

      filter: brightness(0) invert(1);

      pointer-events: none;

      user-select: none;
    }


    /* =========================================
       FULLSCREEN BUTTON
       ========================================= */

    .fullscreen-button {
      position: fixed;

      top: 18px;
      right: 25px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.35);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.35);

      color: #ffffff;

      font-size: 23px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }


    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.60);

      transform: scale(1.08);
    }


    .fullscreen-button:active {
      transform: scale(0.95);
    }


    /* =========================================
       9:16 PORTRAIT CONTAINER
       ========================================= */

    .portrait-container {

      position: relative;

      width: min(
        90vw,
        calc(92dvh * 9 / 16)
      );

      aspect-ratio: 9 / 16;

      max-height: 92dvh;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.30);

      transition:
        width 0.45s ease,
        height 0.45s ease,
        border-radius 0.45s ease,
        box-shadow 0.45s ease,
        transform 0.45s ease;
    }


    /* =========================================
       ANAM CROPPING WINDOW
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;
    }


    /* =========================================
       ANAM IFRAME
       
       ORIGINAL 190% WIDTH RETAINED
       ========================================= */

    .anam-crop iframe {

      position: absolute;

      width: 190%;

      height: 100%;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      margin: 0;
      padding: 0;

      border: 0;

      display: block;

      background: #4f008c;

      /*
       * PRE-CALL BLUR
       *
       * The iframe starts blurred.
       * JavaScript removes this class when
       * the Anam frame reports that the call/session
       * has started.
       */

      filter: blur(12px);

      -webkit-filter: blur(12px);

      transition:
        filter 0.8s ease,
        -webkit-filter 0.8s ease;
    }


    /* =========================================
       AVATAR ACTIVE / CALL STARTED
       ========================================= */

    .anam-crop.call-started iframe {

      filter: blur(0);

      -webkit-filter: blur(0);
    }


    /* =========================================
       FULLSCREEN PORTRAIT
       ========================================= */

    .portrait-container:fullscreen {

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: 100dvh;

      max-height: 100dvh;

      aspect-ratio: 9 / 16;

      margin: 0;

      border-radius: 0;

      box-shadow: none;

      background: #4f008c;

      animation: fullscreenIn 0.45s ease;
    }


    .portrait-container:fullscreen .anam-crop {
      border-radius: 0;
    }


    /* =========================================
       FULLSCREEN ANIMATION
       ========================================= */

    @keyframes fullscreenIn {

      0% {
        opacity: 0.85;
        transform: scale(0.96);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .stc-logo {

        top: 14px;
        left: 16px;

        width: 78px;
      }


      .fullscreen-button {

        top: 12px;
        right: 15px;

        width: 42px;
        height: 42px;

        font-size: 20px;
      }


      .portrait-container {

        width: min(
          94vw,
          calc(94dvh * 9 / 16)
        );

        max-height: 94dvh;

        border-radius: 16px;
      }


      .anam-crop {

        border-radius: 16px;
      }

    }


    /* =========================================
       LANDSCAPE / SHORT SCREEN
       ========================================= */

    @media (max-height: 600px) {

      .portrait-container {

        height: 92dvh;

        width: calc(
          92dvh * 9 / 16
        );

        max-width: 90vw;
      }

    }

  </style>

</head>

<body>

  <!-- =======================================
       MAIN PAGE
       ======================================= -->

  <main class="page">

```
<!-- =====================================
     STC LOGO
     ===================================== -->

<img
  class="stc-logo"
  src="stcimages.jpg"
  alt="stc"
>


<!-- =====================================

<button
  id="fullscreenButton"

>
  ⛶
</button>


<!-- =====================================
     9:16 PORTRAIT CONTAINER
     ===================================== -->

<section
  id="anamPortrait"
  class="portrait-container"
>

  <!-- ===================================
       ANAM CROPPING WINDOW
       =================================== -->

  <div
    id="anamCrop"
    class="anam-crop"
  >


    <!-- ================================
         ANAM AI AVATAR
         ================================ -->

    <iframe
      id="anamFrame"
      src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"

</section>
```

  </main>

  <!-- =======================================
       JAVASCRIPT
       ======================================= -->

  <script>

    const portrait =
      document.getElementById("anamPortrait");

    const fullscreenButton =
      document.getElementById("fullscreenButton");

    const anamCrop =
      document.getElementById("anamCrop");

    const anamFrame =
      document.getElementById("anamFrame");


    /* =====================================
       ANAM CALL START DETECTION
       ===================================== */

    /*
     * The Anam iframe is cross-origin, so the
     * parent page cannot directly inspect its DOM.
     *
     * Instead, listen for messages sent by the
     * embedded Anam application.
     */

    window.addEventListener("message", (event) => {

      /*
       * Only accept messages originating from Anam.
       */

      if (
        !event.origin.includes("anam.ai")
      ) {
        return;
      }


      let message = event.data;


      /*
       * Convert message to searchable text.
       */

      let messageText = "";

      try {

        if (typeof message === "string") {

          messageText =
            message.toLowerCase();

        }

        else {

          messageText =
            JSON.stringify(message).toLowerCase();

        }

      }

      catch (error) {

        return;

      }


      /*
       * Look for common session / call / connection
       * indications.
       *
       * When detected, remove the blur.
       */

      const callStarted =
        messageText.includes("call_started") ||
        messageText.includes("call-started") ||
        messageText.includes("callstarted") ||
        messageText.includes("session_started") ||
        messageText.includes("session-started") ||
        messageText.includes("sessionstarted") ||
        messageText.includes("connected") ||
        messageText.includes("connection_established") ||
        messageText.includes("connected");


      if (callStarted) {

        anamCrop.classList.add(
          "call-started"
        );

      }

    });


    /* =====================================
       FULLSCREEN BUTTON
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          }

          else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


    /* =====================================
       FULLSCREEN STATE
       ===================================== */

    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Exit Full Screen"
          );

        }

        else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Full Screen"
          );

        }

      }
    );


    /* =====================================
       IFRAME LOAD
       ===================================== */

    anamFrame.addEventListener(
      "load",
      () => {

        console.log(
          "Anam iframe loaded. Avatar remains blurred until call starts."
        );

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI Portrait 9:16</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #4f008c;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* =========================================
       9:16 PORTRAIT VIEWPORT
       ========================================= */

    .portrait-container {
      position: relative;

      width: min(100vw, 450px);
      height: min(177.78vw, 800px);

      aspect-ratio: 9 / 16;

      background: #4f008c;

      overflow: hidden;
    }

    /* =========================================
       ANAM IFRAME
       ========================================= */

    .anam-frame {
      position: absolute;

      /* Landscape iframe is intentionally
         larger than the portrait viewport */

      width: 900px;
      height: 600px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border: 0;

      display: block;

      background: #4f008c;
    }
  </style>
</head>

<body>

  <div class="portrait-container">

    <iframe
      class="anam-frame"
      src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
      allow="microphone; autoplay"
      allowfullscreen>
    </iframe>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anam AI Portrait 9:16</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;

      background-color: #4f008c;

      /* STC logo in main background */
      background-image: url("stcimages.jpg");
      background-repeat: no-repeat;
      background-position: 25px 25px;
      background-size: 100px auto;

      font-family: Arial, sans-serif;
    }

    /* ==============================
       PORTRAIT CONTAINER
       ============================== */

    .portrait-container {
      position: relative;

      width: min(90vw, 450px);
      aspect-ratio: 9 / 16;

      margin: 30px auto;

      background: #4f008c;

      overflow: hidden;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.30);

      transition: all 0.3s ease;
    }

    /* ==============================
       ANAM CROP
       ============================== */

    .anam-crop {
      position: absolute;
      inset: 0;

      overflow: hidden;

      border-radius: 20px;
    }

    .anam-crop iframe {
      position: absolute;

      top: 0;
      left: 50%;

      width: 177.78%;
      height: 100%;

      transform: translateX(-50%);

      border: 0;

      display: block;
    }

    /* ==============================
       FULL SCREEN BUTTON
       ============================== */

    .fullscreen-button {
      position: absolute;

      right: 15px;
      bottom: 15px;

      z-index: 20;

      width: 44px;
      height: 44px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 22px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.85);
      transform: scale(1.05);
    }

    /* ==============================
       FULL SCREEN MODE
       ============================== */

    .portrait-container:fullscreen {
      width: 100vw;
      height: 100vh;

      max-width: none;

      aspect-ratio: auto;

      margin: 0;

      border-radius: 0;

      background: #4f008c;
    }

    .portrait-container:fullscreen .anam-crop {
      border-radius: 0;
    }

    /*
      Keep the Anam content portrait
      while in full-screen mode.
    */
    .portrait-container:fullscreen .anam-crop {
      width: min(100vw, 56.25vh);
      height: 100vh;

      left: 50%;
      right: auto;

      transform: translateX(-50%);
    }

    .portrait-container:fullscreen .fullscreen-button {
      right: 20px;
      bottom: 20px;
    }

    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 600px) {

      .portrait-container {
        width: 94vw;
        margin: 20px auto;
      }

      .fullscreen-button {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =================================
       ANAM AI PORTRAIT
       ================================= -->

  <div
    id="anamPortrait"
    class="portrait-container"
  >

    <div class="anam-crop">

      <iframe
        src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
        width="720"
        height="480"
        allow="microphone; fullscreen"
        allowfullscreen>
      </iframe>

    </div>

    <!-- Full Screen Button -->
    <button
      id="fullscreenButton"
      class="fullscreen-button"
      type="button"
      aria-label="Enter full screen"
      title="Full Screen"
    >
      ⛶
    </button>

  </div>


  <script>
    const portrait = document.getElementById("anamPortrait");
    const fullscreenButton =
      document.getElementById("fullscreenButton");

    fullscreenButton.addEventListener("click", async () => {

      try {

        if (!document.fullscreenElement) {

          await portrait.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Full screen error:",
          error
        );

      }

    });


    /* Change icon when entering/exiting fullscreen */
    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";
          fullscreenButton.title = "Exit Full Screen";

        } else {

          fullscreenButton.textContent = "⛶";
          fullscreenButton.title = "Full Screen";

        }

      }
    );
  </script>

</body>
</html>

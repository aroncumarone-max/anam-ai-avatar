<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI Avatar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
    }

    /*
      Main screen
      Always uses a 9:16 portrait layout
    */
    .screen {
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #1c2742 0%,
          #0b1020 65%
        );
    }

    /*
      9:16 portrait container

      Desktop:
      Height determines the size.

      Mobile:
      Width determines the size.
    */
    .portrait {
      position: relative;

      width: min(56.25vh, 100vw);
      height: min(100vh, 177.7778vw);

      aspect-ratio: 9 / 16;

      overflow: hidden;

      background: #000;

      border-radius: 0;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /*
      Anam AI iframe

      The iframe itself remains 9:16.
    */
    .avatar-frame {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #000;

      /*
        Prevent iframe from adding unwanted scrolling.
      */
      overflow: hidden;
    }

    /*
      Optional overlay for a clean screen appearance.
      It does NOT block microphone/avatar interaction.
    */
    .top-gradient {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 120px;

      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35),
        transparent
      );

      pointer-events: none;

      z-index: 2;
    }

    /*
      Desktop information label
    */
    .desktop-label {
      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 3;

      padding: 8px 12px;

      color: white;

      font-size: 12px;

      background: rgba(0, 0, 0, 0.35);

      border: 1px solid rgba(255, 255, 255, 0.15);

      border-radius: 20px;

      backdrop-filter: blur(8px);

      pointer-events: none;
    }

    /*
      Mobile
    */
    @media (max-width: 600px) {

      .screen {
        background: #000;
      }

      .portrait {
        width: 100vw;
        height: 100vh;

        /*
          Keep exact 9:16 ratio.
        */
        aspect-ratio: 9 / 16;

        border-radius: 0;

        box-shadow: none;
      }

      .desktop-label {
        display: none;
      }
    }

    /*
      Desktop portrait screen
    */
    @media (min-width: 601px) {

      .portrait {
        /*
          Maximum portrait size:
          9:16
        */
        width: min(450px, 56.25vh);
        height: min(800px, 100vh);
      }
    }
  </style>

</head>

<body>

  <div class="screen">

```
<div class="portrait">

  <!-- Anam AI Avatar -->
  <iframe
    class="avatar-frame"
    src="https://lab.anam.ai/frame/3ef964c0-2789-4ba5-a734-ddda2cf99ce7"
    allow="microphone"
    title="Anam AI Virtual Assistant">
  </iframe>

  <!-- Visual overlay -->
  <div class="top-gradient"></div>

  <!-- Desktop label -->
  <div class="desktop-label">
    AI Assistant
  </div>

</div>

  </div>

</body>
</html>

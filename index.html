<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AI Agent Portrait</title>


  <style>

    /* =========================================
       GLOBAL
       ========================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          ##ffffff 0%,
          #6500a8 45%,
          ##ffffff 100%
        );

    }


    /* =========================================
       MAIN PAGE
       ========================================= */

    .page {

      position: relative;

      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          ##ffffff 0%,
          #6500a8 45%,
          ##ffffff 100%
        );

    }


    /* =========================================
       DECORATIVE STC BACKGROUND
       ========================================= */

    .page::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 320px;
      height: 220px;

      background: rgba(255, 255, 255, 0.035);

      clip-path: polygon(
        0 0,
        100% 0,
        60% 100%,
        0 100%
      );

      pointer-events: none;

    }


    .page::after {

      content: "";

      position: absolute;

      right: -80px;
      bottom: -80px;

      width: 520px;
      height: 430px;

      background: rgba(255, 0, 160, 0.12);

      clip-path: polygon(
        45% 0,
        100% 0,
        100% 100%,
        0 100%
      );

      pointer-events: none;

    }


    /* =========================================
       STC LOGO
       ========================================= */

    .stc-logo {

      position: fixed;

      top: 35px;
      left: 45px;

      width: 108px;
      height: auto;

      z-index: 1000;

      filter:
        brightness(0)
        invert(1);

      pointer-events: none;

      user-select: none;

    }


    /* =========================================
       FULLSCREEN BUTTON
       ========================================= */

    .fullscreen-button {

      position: fixed;

      top: 46px;
      right: 40px;

      z-index: 1000;

      width: 58px;
      height: 58px;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.18);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.22);

      color: #ffffff;

      font-size: 25px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      transition:
        background 0.25s ease,
        transform 0.25s ease;

    }


    .fullscreen-button:hover {

      background: rgba(0, 0, 0, 0.42);

      transform: scale(1.06);

    }


    .fullscreen-button:active {

      transform: scale(0.94);

    }


    /* =========================================
       AVATAR CONTAINER

       EXACT SIZE:
       WIDTH  = 720px
       HEIGHT = 480px
       RATIO  = 3:2
       ========================================= */

    .portrait-container {

      position: relative;

      width: 720px;
      height: 480px;

      flex: 0 0 720px;

      overflow: hidden;

      background: #d3d3d3;

      border-radius: 20px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.38);

      z-index: 10;

    }


    /* =========================================
       ANAM WINDOW
       ========================================= */

    .anam-crop {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #d3d3d3;

      border-radius: inherit;

    }


    /* =========================================
       ANAM IFRAME

       EXACT SIZE:
       720 × 480
       ========================================= */

    .anam-crop iframe {

      position: absolute;

      inset: 0;

      width: 720px;
      height: 480px;

      min-width: 720px;
      min-height: 480px;

      max-width: none;
      max-height: none;

      margin: 0;
      padding: 0;

      border: 0;

      display: block;

      background: #d3d3d3;

    }


    /* =========================================
       FULLSCREEN MODE

       EXACT SIZE:
       720 × 480
       ========================================= */

    .portrait-container:fullscreen {

      width: 720px;
      height: 480px;

      flex: none;

      margin: 0;

      border-radius: 0;

      box-shadow: none;

      background: #d3d3d3;

      position: fixed;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

    }


    .portrait-container:fullscreen .anam-crop {

      border-radius: 0;

    }


    /* =========================================
       SMALL SCREENS

       Scale the entire 720 × 480 unit.
       Iframe remains 720 × 480.
       ========================================= */

    @media (max-width: 752px),
           (max-height: 512px) {

      .portrait-container {

        width: 720px;
        height: 480px;

        transform:
          scale(
            min(
              calc((100vw - 32px) / 720),
              calc((100dvh - 32px) / 480),
              1
            )
          );

      }


      .stc-logo {

        top: 20px;
        left: 20px;

        width: 82px;

      }


      .fullscreen-button {

        top: 18px;
        right: 18px;

        width: 46px;
        height: 46px;

        font-size: 21px;

      }

    }


    /* =========================================
       VERY SMALL SCREENS
       ========================================= */

    @media (max-height: 340px) {

      .portrait-container {

        transform:
          scale(
            min(
              calc((100vw - 20px) / 720),
              calc((100dvh - 20px) / 480)
            )
          );

      }

    }


  </style>

</head>


<body>


  <!-- =======================================
       MAIN PAGE
       ======================================= -->

  <main class="page">


    <!-- =====================================
         STC LOGO
         ===================================== -->

    <img
      class="stc-logo"
      src="stcimages.jpg"
      alt="stc"
    >


    <!-- =====================================
         FULLSCREEN BUTTON
         ===================================== -->

    <button
      id="fullscreenButton"
      class="fullscreen-button"
      type="button"
      aria-label="Full Screen"
      title="Full Screen"
    >
      ⛶
    </button>


    <!-- =====================================
         AI AGENT

         EXACT SIZE:
         720 × 480
         ===================================== -->

    <section
      id="anamPortrait"
      class="portrait-container"
    >

      <div class="anam-crop">

        <iframe
          src="https://lab.anam.ai/frame/3ef964c0-2789-4ba5-a734-ddda2cf99ce7"
          width="720"
          height="480"
          allow="microphone; fullscreen"
          allowfullscreen>
        </iframe>

      </div>

    </section>


  </main>


  <!-- =======================================
       FULLSCREEN JAVASCRIPT
       ======================================= -->

  <script>

    const portrait =
      document.getElementById("anamPortrait");


    const fullscreenButton =
      document.getElementById("fullscreenButton");


    /* =====================================
       FULLSCREEN BUTTON
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          }

          else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


    /* =====================================
       FULLSCREEN STATE
       ===================================== */

    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Exit Full Screen"
          );

        }

        else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

          fullscreenButton.setAttribute(
            "aria-label",
            "Full Screen"
          );

        }

      }
    );

  </script>


</body>

</html>

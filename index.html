<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI Portrait Avatar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #4f008c;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* =====================================
       PORTRAIT 9:16 IFRAME CONTAINER
       ===================================== */

    .anam-portrait {
      width: min(90vw, 450px);
      aspect-ratio: 9 / 16;

      background: #4f008c;

      position: relative;
      overflow: hidden;

      border: 0;
    }

    /* =====================================
       ANAM IFRAME
       ===================================== */

    .anam-portrait iframe {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;

      background: #4f008c;
    }
  </style>
</head>

<body>

  <div class="anam-portrait">

    <iframe
      src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
      allow="microphone; autoplay"
      allowfullscreen>
    </iframe>

  </div>

</body>
</html>

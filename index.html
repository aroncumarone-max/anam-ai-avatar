<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Anam AI Portrait</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #4f008c;

      font-family: Arial, sans-serif;
    }


    /* =====================================
       STC LOGO
       OUTSIDE THE IFRAME
       TOP LEFT
       ===================================== */

    .stc-logo {
      position: fixed;

      top: 20px;
      left: 25px;

      width: 100px;
      height: auto;

      z-index: 100;

      /*
        White logo effect
      */
      filter:
        brightness(0)
        invert(1);

      pointer-events: none;
    }


    /* =====================================
       PAGE
       ===================================== */

    .page {
      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =====================================
       PORTRAIT CONTAINER
       9:16
       ===================================== */

    .portrait-container {
      position: relative;

      width: min(
        90vw,
        calc(94dvh * 9 / 16)
      );

      aspect-ratio: 9 / 16;

      max-height: 94dvh;

      background: #4f008c;

      overflow: hidden;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.30);
    }


    /* =====================================
       ANAM CROP
       ===================================== */

    .anam-crop {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #4f008c;

      border-radius: 20px;
    }


    /* =====================================
       ANAM IFRAME
       ===================================== */

    .anam-crop iframe {
      position: absolute;

      top: 0;
      left: 50%;

      width: 177.78%;
      height: 100%;

      transform: translateX(-50%);

      margin: 0;
      padding: 0;

      border: 0;

      display: block;
    }


    /* =====================================
       FULL SCREEN BUTTON
       ===================================== */

    .fullscreen-button {
      position: absolute;

      right: 14px;
      bottom: 14px;

      z-index: 20;

      width: 44px;
      height: 44px;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.65);

      color: #ffffff;

      font-size: 22px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.85);
    }


    /* =====================================
       FULL SCREEN
       ===================================== */

    .portrait-container:fullscreen {

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: auto;

      max-height: 100dvh;

      aspect-ratio: 9 / 16;

      border-radius: 0;

      box-shadow: none;
    }

    .portrait-container:fullscreen
    .anam-crop {
      border-radius: 0;
    }


    /* =====================================
       MOBILE
       ===================================== */

    @media (max-width: 600px) {

      .stc-logo {
        top: 12px;
        left: 15px;

        width: 80px;
      }

      .portrait-container {

        width: min(
          94vw,
          calc(94dvh * 9 / 16)
        );

        max-height: 94dvh;

        border-radius: 16px;
      }

      .fullscreen-button {

        width: 42px;
        height: 42px;

        right: 10px;
        bottom: 10px;

        font-size: 20px;
      }
    }


    /* =====================================
       SHORT DESKTOP / LANDSCAPE
       ===================================== */

    @media (max-height: 600px) {

      .portrait-container {

        height: 92dvh;

        width: calc(92dvh * 9 / 16);

        max-width: 90vw;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================
       STC LOGO
       COMPLETELY OUTSIDE IFRAME
       ===================================== -->

  <img
    class="stc-logo"
    src="stcimages.jpg"
    alt="stc"
  >


  <!-- =====================================
       PAGE
       ===================================== -->

  <main class="page">


    <!-- ===================================
         ANAM AI PORTRAIT
         =================================== -->

    <section
      id="anamPortrait"
      class="portrait-container"
    >

      <div class="anam-crop">

        <iframe
          src="https://lab.anam.ai/frame/3d31783d-0b54-490c-971b-654cdc4a4dc5"
          allow="microphone; fullscreen"
          allowfullscreen>
        </iframe>

      </div>


      <!-- FULL SCREEN BUTTON -->

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        type="button"
        aria-label="Full Screen"
        title="Full Screen"
      >
        ⛶
      </button>

    </section>

  </main>


  <!-- =====================================
       FULL SCREEN JAVASCRIPT
       ===================================== -->

  <script>

    const portrait =
      document.getElementById("anamPortrait");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await portrait.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


    document.addEventListener(
      "fullscreenchange",
      () => {

        if (document.fullscreenElement) {

          fullscreenButton.textContent = "✕";

          fullscreenButton.title =
            "Exit Full Screen";

        } else {

          fullscreenButton.textContent = "⛶";

          fullscreenButton.title =
            "Full Screen";

        }

      }
    );

  </script>

</body>
</html>
